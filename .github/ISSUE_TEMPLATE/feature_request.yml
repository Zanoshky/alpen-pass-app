name: Feature request
description: An idea for something Alpen Pass could do.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want
      description: Describe the feature in a few lines.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it help you do? A real example helps.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Which screen?"
      options:
        - Welcome
        - Lernen (Learn)
        - study chapter
        - Weg zur Staatsbürgerschaft (Path to citizenship)
        - Wörter (Words)
        - Üben (Practice)
        - Probeprüfung (mock exam)
        - result
        - Einstellungen (Settings)
        - Offizielle Quellen (Official sources)
        - Über (About)
        - Pro page
        - A question or answer is wrong
        - other
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Pictures or links
      description: A sketch, a screenshot or a link to something similar.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and this idea is not there yet.
          required: true
